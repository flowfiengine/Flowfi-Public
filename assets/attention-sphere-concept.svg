<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">FlowFi — Attention Sphere concept illustration</title>
<desc id="desc">Abstract connected orbs representing the FlowFi discovery journey. Concept illustration only, not actual application data or a product screenshot.</desc>
<defs>
